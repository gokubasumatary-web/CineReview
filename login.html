<!DOCTYPE html>

<style>
        .glass-surface {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ai-glow {
            box-shadow: 0 0 40px -10px rgba(229, 9, 20, 0.3);
        }
        .cinematic-overlay {
            background: linear-gradient(to bottom, rgba(19, 19, 19, 0.5) 0%, rgba(19, 19, 19, 0.9) 100%);
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        }
        
        /* Floating poster animations */
        @keyframes float1 {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(-3deg); }
        }
        @keyframes float2 {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-15px) rotate(8deg); }
        }
        @keyframes float3 {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-25px) rotate(-5deg); }
        }
        
        .poster-1 { animation: float1 8s ease-in-out infinite; }
        .poster-2 { animation: float2 9s ease-in-out infinite; animation-delay: 1s; }
        .poster-3 { animation: float3 7s ease-in-out infinite; animation-delay: 2s; }
    </style>
</head>
<body class="bg-surface-dim text-on-surface font-body-md overflow-hidden">
<main class="flex min-h-screen w-full">
<!-- Left Side: High-Impact Cinematic Visual -->
<section class="hidden lg:flex lg:w-[55%] relative overflow-hidden flex-col justify-between p-xl">
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="A moody, cinematic wide shot of a futuristic private home theater or sci-fi movie scene with deep velvet textures and ambient red glowing accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWpIf56nyRRg6zR-rT30LZCLKJH1Ftn1zq6jyAq2-_dpyDHMg1JzyI7qbnRttSomF8YLE7faSBssdyHattC-q8w23Ld-yBEOIPD_sgyoqEGsq4H2EHRnuSu29mtRmxgu9aLmbQDfr49hXusfD5o4FiVVqX3e1mKro_xVROJVVYlL-Ow5-Qb3pdH3hvAiwcwHOMXqba-ptxB0LmaN_NmEw2Uk_oCZKfz_ZlnFr5axzpbnB8CpO54UDNrppEZiXQEeDEAi1mm1yw1eY"/>
<div class="absolute inset-0 bg-black/50 z-10"></div>
<div class="absolute inset-0 cinematic-overlay z-10"></div>
</div>
<!-- Floating Poster Collage -->
<div class="absolute right-0 top-1/4 w-1/2 h-1/2 z-10 pointer-events-none opacity-40">
<div class="absolute right-10 top-0 w-32 h-48 bg-surface-container rounded-lg shadow-2xl poster-1 border border-white/10 overflow-hidden">
<div class="w-full h-full bg-gradient-to-br from-red-900/50 to-surface"></div>
</div>
<div class="absolute right-32 top-20 w-40 h-56 bg-surface-container-high rounded-lg shadow-2xl poster-2 border border-white/10 overflow-hidden">
<div class="w-full h-full bg-gradient-to-br from-blue-900/40 to-surface"></div>
</div>
<div class="absolute right-4 top-40 w-36 h-52 bg-surface-container-highest rounded-lg shadow-2xl poster-3 border border-white/10 overflow-hidden">
<div class="w-full h-full bg-gradient-to-br from-purple-900/40 to-surface"></div>
</div>
</div>
<div class="relative z-20 flex flex-col h-full justify-between">
<div>
<span class="text-red-600 font-black italic tracking-tighter text-4xl font-h1-hero">CineReview</span>
</div>
<div class="max-w-2xl mt-auto mb-20">
<h1 class="font-h1-hero text-5xl lg:text-6xl text-white mb-md leading-tight">
            Your AI-Powered <br/><span class="text-primary-container text-glow">Movie Companion.</span>
</h1>
</div>
<div class="mt-auto">
<p class="text-slate-400 font-body-md text-sm">Join 2M+ movie enthusiasts</p>
</div>
</div>
</section>
<!-- Right Side: Login Form -->
<section class="w-full lg:w-[45%] flex flex-col justify-center items-center px-margin-mobile md:px-lg lg:px-xl relative bg-[#0e0e0e]">
<!-- Mobile Logo -->
<div class="lg:hidden absolute top-md left-md">
<span class="text-red-600 font-black italic tracking-tighter text-2xl font-h1-hero">CineReview</span>
</div>
<div class="w-full max-w-md glass-surface p-lg rounded-2xl ai-glow">
<header class="mb-lg text-center">
<h2 class="font-h2-title text-h2-title text-white mb-xs font-bold">Welcome Back</h2>
<p class="text-slate-400 font-body-md">Sign in to continue your movie journey.</p>
</header>
<form class="space-y-md">
<div class="space-y-xs">
<label class="font-label-caps text-slate-400 uppercase">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">mail</span>
<input class="w-full bg-surface-container-high/50 backdrop-blur-sm border border-white/10 rounded-xl py-3 pl-12 pr-4 text-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:shadow-[0_0_15px_rgba(229,9,20,0.3)] transition-all" placeholder="your@email.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-slate-400 uppercase">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">lock</span>
<input class="w-full bg-surface-container-high/50 backdrop-blur-sm border border-white/10 rounded-xl py-3 pl-12 pr-12 text-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:shadow-[0_0_15px_rgba(229,9,20,0.3)] transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex justify-between items-center py-2">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 rounded border border-white/20 bg-surface-container-high/50 group-hover:border-primary/50 transition-colors">
<input class="opacity-0 absolute inset-0 cursor-pointer w-full h-full peer" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-white opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="text-sm text-slate-400 group-hover:text-slate-300 transition-colors">Remember me</span>
</label>
<a class="text-sm font-medium text-red-600 hover:text-red-500 transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-[#E50914] hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(229,9,20,0.4)] transform active:scale-95 transition-all duration-150 flex items-center justify-center gap-base mt-4" type="submit">
<span>Sign In</span>
</button>
</form>
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
<div class="relative flex justify-center text-xs uppercase"><span class="bg-surface px-4 text-slate-500 font-label-caps backdrop-blur-md rounded-full">Or continue with</span></div>
</div>
<div class="grid grid-cols-3 gap-sm">
<button class="flex items-center justify-center py-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all">
<img alt="Google Logo" class="w-5 h-5" data-alt="Official Google G-logo symbol for social authentication, isolated on a clean transparent background with high fidelity graphics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDI-2JwP-csKNYxX6ohw6IrzcLFtqn-lTkplxDO_1Usl5iyi2hwYLVpYDEWcm6Z4oIAYvwFjqKYZ46K_RGxZYUEKEEBxt3PuZPMP1QO4bi0RChes50kXjIVtWymoGvJWsU2b1fP5JTkXrhAfXXwszr6nhmcMilWW0TcxtVmczirSCUmQfh_RF2-1cXzU2ukt9eSXPkbHWtE7QTjC15o4hd2NdsJWRtIprR72aK5LHTW5dmHJlihsE3LaSjxp12hTTfDKBs693HAztQ"/>
</button>
<button class="flex items-center justify-center py-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">ios</span>
</button>
<button class="flex items-center justify-center py-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-white font-bold text-lg">
X
</button>
</div>
<footer class="mt-lg text-center">
<p class="text-slate-400 text-sm">
                        Don't have an account? 
                        <a class="text-[#E50914] font-bold hover:underline" href="#">Sign Up</a>
</p>
</footer>
</div>
</section>
</main>
<!-- Background Ambient Glows -->
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[120px] pointer-events-none z-[-1]"></div>
<div class="fixed bottom-[-10%] left-[40%] w-[600px] h-[600px] bg-tertiary-container/5 rounded-full blur-[150px] pointer-events-none z-[-1]"></div>
</body></html>
